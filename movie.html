<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>测试电影 01 - 电影之家</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 顶部导航栏 -->
    <header class="navbar">

        <div class="logo">
            🎬 电影之家
        </div>

        <nav class="nav-menu">
            <a href="index.html">首页</a>
            <a href="#">电影</a>
            <a href="#">分类</a>
            <a href="#">排行榜</a>
        </nav>

        <div class="search-box">
            <input type="text" placeholder="搜索电影...">
            <button>搜索</button>
        </div>

    </header>


    <!-- 电影详情 -->
    <main class="movie-detail">

        <div class="detail-poster">

            <img id="detail-poster" src="images/movie1.jpg" alt="测试电影 01">

        </div>


        <div class="detail-info">

            <h1 id="detail-title">测试电影 01</h1>

            <p id="detail-type" class="detail-type">
                科幻 / 剧情
            </p>

            <p id="detail-year">
                上映年份：2026
            </p>

            <p id="detail-rating">
                  评分：⭐ 8.8
            </p>

            <p>
                导演：测试导演
            </p>

            <p id="detail-description" class="description">
                这是一部用于测试电影网站功能的示例电影。
                这里以后可以填写真正的电影简介，包括剧情介绍、
                演员信息、导演信息以及其他电影资料。
            </p>

            <a id="play-button" href="player.html" class="hero-button">
                ▶ 立即播放
            </a>

        </div>

    </main>


    <!-- 推荐电影 -->

    <section class="container">

        <h2 class="section-title">
            🎬 猜你喜欢
        </h2>

        <div class="movie-grid">

            <div class="movie-card">

                <div class="movie-poster">
                    电影海报
                </div>

                <div class="movie-info">

                    <h3 class="movie-title">
                        推荐电影 01
                    </h3>

                    <p class="movie-type">
                        动作 / 冒险
                    </p>

                </div>

            </div>

        </div>

    </section>


    <!-- 页脚 -->

    <footer class="footer">

        <p>
            © 2026 电影之家 · 电影世界
        </p>

    </footer>
<script src="script.js"></script>
</body>

</html>
